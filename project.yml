# Source of truth for Plain.xcodeproj, which is generated and not tracked.
# Run `xcodegen generate` after cloning and after adding, moving or deleting files.
name: Plain
options:
  bundleIdPrefix: dev.abrahamgonzalez
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true
# Signing team comes from the gitignored Config/Signing.local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
packages:
  PlainKit:
    path: Packages/PlainKit
targets:
  # A thin wrapper: launch, scene and window. Everything else lives in Packages/PlainKit.
  Plain:
    type: application
    platform: iOS
    sources:
      - path: Plain
      # The app icon, an Icon Composer document. actool compiles it into the layered icon and
      # the flat ones older systems use.
      - path: Brand/AppIcon.icon
      # Alternate icons the user can pick (first-run intro, Settings > App Icon), named in
      # ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES below.
      - path: Brand/AppIcon-Night.icon
      - path: Brand/AppIcon-Coral.icon
      - path: Brand/AppIcon-Paper.icon
    dependencies:
      - package: PlainKit
        product: ShellUI
      # The first-run intro (shown once, before the browser).
      - package: PlainKit
        product: FeatureUI
      - package: PlainKit
        product: Storage
      - package: PlainKit
        product: PerfSignposts
    settings:
      base:
        # Local device installs pass PLAIN_BUNDLE_SUFFIX=.dev and PLAIN_DISPLAY_SUFFIX=" Dev"
        # (scripts/install-duo.sh, perf-gate.sh --device), so they sit beside the TestFlight app
        # instead of replacing it and never touch its data. TestFlight and Xcode Cloud leave both empty.
        PLAIN_BUNDLE_SUFFIX: ""
        PLAIN_DISPLAY_SUFFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.plainbrowser$(PLAIN_BUNDLE_SUFFIX)
        PRODUCT_NAME: Plain
        # The name under the icon.
        APP_DISPLAY_NAME: Plain$(PLAIN_DISPLAY_SUFFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # actool compiles these into the app and lists them under CFBundleAlternateIcons, so
        # UIApplication.setAlternateIconName can switch to them. Names match FeatureUI's AppIconChoice.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Night AppIcon-Coral AppIcon-Paper
        INFOPLIST_FILE: Plain/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # UI code: MainActor by default, like the package's UI targets. (Not on the UI tests:
        # XCTestCase's overrides are nonisolated, so those classes say @MainActor themselves.)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # UI smoke tests and the launch/hitch perf tests the perf gate runs on the device.
  PlainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlainUITests
        excludes:
          - "*.xctestplan"
    dependencies:
      - target: Plain
      # Signpost names, shared with the app so the metrics measure exactly what the app emits.
      - package: PlainKit
        product: PerfSignposts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.plainbrowser.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Plain
schemes:
  Plain:
    build:
      targets:
        Plain: all
        PlainUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        # Every UI test except the perf tests. scripts/test.sh runs it on simulators.
        - path: PlainUITests/Smoke.xctestplan
          defaultPlan: true
        # Only the perf tests. scripts/perf-gate.sh runs it on the device in Release.
        - path: PlainUITests/Perf.xctestplan
    archive:
      config: Release
