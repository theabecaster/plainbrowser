# Source of truth for Plain.xcodeproj, which is generated and not tracked.
# Run `xcodegen generate` after cloning and after adding, moving or deleting files.
name: Plain
options:
  bundleIdPrefix: dev.abrahamgonzalez
  deploymentTarget:
    iOS: "27.2"
  createIntermediateGroups: true
# Signing team comes from the gitignored Config/Signing.local.xcconfig.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
packages:
  PlainKit:
    path: Packages/PlainKit
targets:
  # A thin wrapper: launch, scene and window. Everything else lives in Packages/PlainKit.
  Plain:
    type: application
    platform: iOS
    sources:
      - path: Plain
      # The app icon, an Icon Composer document. actool compiles it into the layered icon and
      # the flat ones older systems use.
      - path: Brand/AppIcon.icon
      # Alternate icons the user can pick (first-run intro, Settings > App Icon), named in
      # ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES below.
      - path: Brand/AppIcon-Night.icon
      - path: Brand/AppIcon-Coral.icon
      - path: Brand/AppIcon-Paper.icon
      # The controls' intent: App Intents opens the app only when the intent is in both targets.
      - path: PlainWidgets/OpenPlainIntent.swift
    dependencies:
      # The widget extension, embedded in PlugIns.
      - target: PlainWidgets
      - package: PlainKit
        product: ShellUI
      # The first-run intro (shown once, before the browser).
      - package: PlainKit
        product: FeatureUI
      - package: PlainKit
        product: Storage
      - package: PlainKit
        product: PerfSignposts
      # App Intents, widget links and Handoff: the commands, the App Group file, the Spotlight sync.
      - package: PlainKit
        product: PlainShared
      - package: PlainKit
        product: SystemSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.plainbrowser
        # The App Group shared with the widget extension (docs/development.md, "Widgets and App Group").
        CODE_SIGN_ENTITLEMENTS: Plain/Plain.entitlements
        PRODUCT_NAME: Plain
        # The name under the icon.
        APP_DISPLAY_NAME: Plain
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # actool compiles these into the app and lists them under CFBundleAlternateIcons, so
        # UIApplication.setAlternateIconName can switch to them. Names match FeatureUI's AppIconChoice.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Night AppIcon-Coral AppIcon-Paper
        INFOPLIST_FILE: Plain/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # UI code: MainActor by default, like the package's UI targets. (Not on the UI tests:
        # XCTestCase's overrides are nonisolated, so those classes say @MainActor themselves.)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # The search widget (Home Screen, StandBy, Lock Screen) and the Control Center controls. A thin
  # wrapper: the views and timeline are PlainKit's WidgetUI. Nothing in it runs at app launch.
  PlainWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PlainWidgets
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: PlainKit
        product: WidgetUI
      - package: PlainKit
        product: PlainShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.plainbrowser.widgets
        PRODUCT_NAME: PlainWidgets
        APP_DISPLAY_NAME: Plain
        INFOPLIST_FILE: PlainWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PlainWidgets/PlainWidgets.entitlements
        SKIP_INSTALL: YES
        # The intent's perform runs on the main actor in both targets.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Hosted unit tests: App Intents performed inside the app. No package products of its own: it
  # uses the app's copies (a second copy would be a second CommandInbox).
  PlainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlainTests
    dependencies:
      - target: Plain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.plainbrowser.tests
        GENERATE_INFOPLIST_FILE: YES
  # UI smoke tests and the launch/hitch perf tests the perf gate runs on the device.
  PlainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlainUITests
        excludes:
          - "*.xctestplan"
    dependencies:
      - target: Plain
      # Signpost names, shared with the app so the metrics measure exactly what the app emits.
      - package: PlainKit
        product: PerfSignposts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abrahamgonzalez.plainbrowser.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Plain
schemes:
  Plain:
    build:
      targets:
        Plain: all
        PlainUITests: [test]
        PlainTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        # Every UI test except the perf tests. scripts/test.sh runs it on simulators.
        - path: PlainUITests/Smoke.xctestplan
          defaultPlan: true
        # Only the perf tests. scripts/perf-gate.sh runs it on the device in Release.
        - path: PlainUITests/Perf.xctestplan
    archive:
      config: Release
